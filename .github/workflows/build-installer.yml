# Build the Windows installer for MediaTool.
#
# Triggers:
#   - every push (any branch)  -> builds installer + uploads artifacts
#   - pushing a tag like v1.2.3 -> also publishes a GitHub release
#   - manual workflow_dispatch  -> builds + uploads artifacts (no release)
#
# Jobs:
#   build          - PyInstaller (onedir) + Inno Setup -> uploads artifacts
#   create-release - downloads artifacts, publishes a GitHub release
#                    (only when a v* tag is pushed; needs build to succeed)
#
# Outputs (uploaded as artifacts / release assets):
#   dist/MediaTool-Setup-<version>.exe        Inno Setup installer
#   dist/MediaTool-<version>-portable.zip     portable (no-install) build
#
# Version is taken from the git tag (v-prefix stripped); without a tag it
# falls back to 0.0.<run_number> so Inno always gets a valid X.Y.Z number.

name: Build Windows Installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # one-dir bundle: more reliable resource collection than onefile,
      # and Inno Setup turns it into a proper installer.
      # --paths src makes the runtime sys.path packages (db/ui/core/i18n,
      # logging_setup) visible to PyInstaller's static analysis.
      # --collect-all qfluentwidgets / PyQt6 pulls in qss/qrc resources + Qt plugins.
      # The --add-data destinations are relative to _internal (PyInstaller 6),
      # matching how the code locates them via __file__ (e.g. i18n/*.json).
      - name: Build with PyInstaller (onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name MediaTool `
            --icon "src/assets/icon.ico" `
            --paths src `
            --collect-all qfluentwidgets `
            --collect-all PyQt6 `
            --add-data "src/i18n;i18n" `
            --add-data "src/assets/fonts;assets/fonts" `
            --add-data "src/assets/icon.ico;assets" `
            --add-data "src/db/subgroups.json;db" `
            main.py

      - name: Verify bundled resources
        shell: pwsh
        run: |
          $root = "dist\MediaTool\_internal"
          foreach ($p in @(
            "i18n\zh_CN.json", "i18n\zh_TW.json", "i18n\en_US.json",
            "assets\fonts\HarmonyOS_Sans_SC_Regular.ttf",
            "assets\icon.ico", "db\subgroups.json")) {
            if (-not (Test-Path "$root\$p")) {
              Write-Error "missing bundled resource: $p"
              exit 1
            }
          }
          Write-Host "All bundled resources present"

      # windows-latest no longer ships ffmpeg by default; install it via
      # chocolatey, then copy ffprobe next to the exe so the resolution
      # probe works out of the box (probe_resolution falls back to the
      # exe dir when ffprobe is not on PATH).
      - name: Install ffmpeg (ffprobe)
        run: choco install ffmpeg --no-progress -y

      - name: Bundle ffprobe (resolution probe)
        shell: pwsh
        run: |
          $src = $null
          $ff = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($ff) { $src = $ff.Source }
          elseif (Test-Path "C:\ProgramData\chocolatey\bin\ffprobe.exe") {
            $src = "C:\ProgramData\chocolatey\bin\ffprobe.exe"
          }
          if ($src) {
            Copy-Item $src -Destination "dist\MediaTool\ffprobe.exe" -Force
            Write-Host "ffprobe bundled from $src"
          } else {
            Write-Host "::warning::ffprobe not found - resolution probing disabled"
          }

      # 版本：tag push 时 GITHUB_REF_NAME = "v1.2.3" → "1.2.3";
      # 普通 push 无版本 tag → 用 0.0.<run_number> 保证 Inno 拿到合法 X.Y.Z。
      # 不调用 git describe（无 tag 时退出码非零会把步骤标红失败）。
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "$env:GITHUB_REF_NAME"
          $v = if ($ref -match '^v\d+\.\d+\.\d+') { $ref.Substring(1) } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          "MEDIA_TOOL_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $v"

      # Inno Setup 官方安装包：files.jrsoftware.org 的 exe 已 404，改用 GitHub
      # Release asset（可靠）。官方安装包不含中文语言文件，简体中文 isl 由
      # 仓库 packaging/Languages 自带，iss 用相对路径引用。
      - name: Install Inno Setup (official)
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $setup = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest $url -OutFile $setup
          Start-Process -Wait -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-")
          $dir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup install failed" }
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          iscc /Qp /DMyAppVersion="$env:MEDIA_TOOL_VERSION" /O"dist" "packaging\installer.iss"

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MediaTool" -DestinationPath "dist\MediaTool-$env:MEDIA_TOOL_VERSION-portable.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaTool-${{ env.MEDIA_TOOL_VERSION }}
          path: |
            dist/MediaTool-Setup*.exe
            dist/MediaTool-*-portable.zip
          if-no-files-found: error

  # 独立发布 job：build 成功且为 v* tag 时运行，下载产物并创建 GitHub Release。
  # （与 build 解耦：build 不需要写权限，release 逻辑清晰、可单独重跑）
  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: MediaTool-${{ needs.build.outputs.version }}
          path: release/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/MediaTool-Setup-*.exe \
            release/MediaTool-*-portable.zip \
            --title "MediaTool $GITHUB_REF_NAME" --generate-notes
